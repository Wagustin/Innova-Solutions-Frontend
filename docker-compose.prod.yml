version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: innova-db
    restart: always
    environment:
      POSTGRES_DB: db_innovasolutions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgre}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - innova-network

  backend:
    build:
      context: ../Innova-Solutions-Backend
      dockerfile: Dockerfile
    container_name: innova-backend
    restart: always
    depends_on:
      - db
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/db_innovasolutions
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgre}
      - JWT_SECRET=${JWT_SECRET}
      - IP_FRONTEND=${IP_FRONTEND:-http://localhost}
    networks:
      - innova-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: innova-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - innova-network

networks:
  innova-network:
    driver: bridge

volumes:
  postgres_data:
