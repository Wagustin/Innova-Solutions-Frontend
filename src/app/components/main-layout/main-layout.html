<nav class="navbar">
  <div class="nav-brand" [routerLink]="getInicioLink">
    <span class="icon"><i class="fa-solid fa-book-open"></i></span> Innova-Solutions
  </div>
  
  <ul class="nav-links">
    <ng-container *ngIf="esPadre; else defaultLinks">
      <li><a routerLink="/padre/dashboard" routerLinkActive="active">Inicio</a></li>
      <li><a routerLink="/padre/registrar-alumno" routerLinkActive="active">Mis Hijos</a></li>
      <li><a routerLink="/acerca-de" routerLinkActive="active">Acerca de</a></li>
    </ng-container>
    <ng-template #defaultLinks>
      <li><a routerLink="/inicio" routerLinkActive="active">Inicio</a></li>
      <li><a routerLink="/mis-flashcards" routerLinkActive="active">Mis Flashcards</a></li>
      <ng-container *ngIf="esProfesor">
        <li><a routerLink="/creacion" routerLinkActive="active">Creación</a></li>
        <li><a routerLink="/mis-alumnos" routerLinkActive="active">Mis Alumnos</a></li>
      </ng-container>
      <li><a routerLink="/acerca-de" routerLinkActive="active">Acerca de</a></li>
    </ng-template>
  </ul>

  <div class="nav-profile" #profileMenuContainer>
    <button class="avatar-btn" (click)="toggleProfileMenu()">
      <span *ngIf="esAlumno" style="font-size: 1.6rem;">{{ fotoPerfil }}</span>
      <span *ngIf="!esAlumno" class="avatar-inicial" [ngClass]="esPadre ? 'bg-padre' : 'bg-profesor'">{{ inicial }}</span>
    </button>
    
    <div class="profile-dropdown" *ngIf="isProfileMenuOpen">
      <a routerLink="/mi-perfil" (click)="closeProfileMenu()">Mi perfil</a>
      <a (click)="logout()" style="cursor: pointer;">Cerrar Sesión</a>
    </div>
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <div class="footer-content">
    <div class="footer-brand">
      <h3>Innova-Solutions</h3>
      <p>Aprendizaje divertido y efectivo.</p>
    </div>
    <div class="footer-social">
      <a href="#">Instagram</a>
      <a href="#">Twitter</a>
      <a href="#">TikTok</a>
      <a href="#">Facebook</a>
    </div>
    <div class="footer-links">
      <a href="#">Privacidad</a>
      <a href="#">Términos</a>
    </div>
  </div>
</footer>
