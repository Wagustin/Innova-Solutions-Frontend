<div class="flashcards-container">
  
  <div class="toolbar">
    <input type="text" class="search-bar" placeholder="Buscar flashcards...">
    <div class="actions">
      <button class="action-btn" title="Ordenar A-Z">A-Z</button>
      <button class="action-btn" title="Editar">
        <span class="css-icon css-icon-pencil css-icon-anim"></span>
      </button>
      <button class="action-btn" title="Eliminar">
        <span class="css-icon css-icon-trash css-icon-anim"></span>
      </button>
    </div>
  </div>

  <div class="flashcards-grid">
    <div *ngFor="let card of flashcards" class="flashcard" [style.backgroundColor]="card.colorFondo || 'var(--bg-pastel-yellow)'">
      <input type="checkbox" class="card-checkbox">
      <div class="card-header">
        <h3 [style.color]="card.colorTexto || 'var(--text-dark)'">{{ card.leccion?.titulo || 'Lección' }}</h3>
        <span>ID: {{ card.id }}</span>
      </div>
      
      <div class="card-content">
        <p class="question" [style.color]="card.colorTexto || 'var(--text-dark)'">{{ card.preguntaTexto }}</p>
        <div class="img-placeholder" *ngIf="!card.imagenUrl">📷 Imagen</div>
        <img *ngIf="card.imagenUrl" [src]="card.imagenUrl" style="max-width:100%; border-radius:12px; max-height:120px;" alt="Flashcard">
        
        <div class="options-container" *ngIf="card.opciones?.length">
          <div *ngFor="let option of card.opciones"
               class="option-item"
               [ngClass]="{
                 'selected': card.selectedOption === option,
                 'disabled': card.isAnswered,
                 'correct': card.isAnswered && option.esCorrecta,
                 'incorrect': card.isAnswered && card.selectedOption === option && !option.esCorrecta
               }"
               (click)="selectOption(card, option)">
            {{ option.textoOpcion }}
          </div>
        </div>

        <div *ngIf="card.isAnswered && card.selectedOption" class="feedback-box" [ngClass]="card.selectedOption.esCorrecta ? 'correct' : 'incorrect'">
          <p class="feedback-title">{{ card.selectedOption.esCorrecta ? '¡Correcto!' : 'Incorrecto' }}</p>
          <p class="feedback-text">{{ card.selectedOption.feedbackRespuesta }}</p>
        </div>
      </div>
      
      <div class="card-actions">
        <button class="btn btn-black" (click)="evaluate(card)" [disabled]="!card.selectedOption || card.isAnswered">
          {{ card.isAnswered ? 'Respondido' : 'Ver respuesta' }}
        </button>
      </div>
    </div>
  </div>

</div>
