<div class="padre-container">
  <div class="padre-card">
    <div class="padre-icon">👨‍👩‍👧‍👦</div>
    <h1>Panel del Padre</h1>
    <p class="welcome-text">Bienvenido, <strong>{{ username }}</strong></p>
    <p class="subtitle">Desde aquí puedes gestionar el acceso de tus hijos a la plataforma.</p>

    <button class="btn btn-primary" (click)="registrarHijo()">
      ➕ Registrar a mi hijo
    </button>

    <button class="btn btn-secondary" (click)="irInicio()">
      📚 Ir al Inicio
    </button>
  </div>
</div>
