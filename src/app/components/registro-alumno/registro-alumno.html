<div class="alumno-container">
  <div class="alumno-card">
    <div class="alumno-header">
      <div class="alumno-icon">🧒</div>
      <h1>Registrar a mi hijo</h1>
      <p class="subtitle">Completa los datos para que tu hijo acceda a la plataforma.</p>
    </div>

    <div *ngIf="submitAttempted && alumnoForm.invalid" class="alert-banner alert-error">
      ⚠ Completa todos los campos correctamente
    </div>
    <div *ngIf="serverErrorMessage" class="alert-banner alert-error">
      ⚠ {{ serverErrorMessage }}
    </div>
    <div *ngIf="registrationSuccess" class="alert-banner alert-success">
      ✓ Alumno registrado correctamente
    </div>

    <form [formGroup]="alumnoForm" (ngSubmit)="onSubmit()" style="width: 100%;">

      <div class="form-group">
        <label>Nombre de Usuario del Niño</label>
        <input type="text" formControlName="nickname" class="form-control"
               [class.error]="submitAttempted && alumnoForm.get('nickname')?.invalid"
               placeholder="Ej. carlitos123">
        <small class="field-hint">(Con este nombre de usuario tu hijo iniciará sesión)</small>
      </div>

      <div class="form-group">
        <label>PIN de acceso (4 dígitos)</label>
        <input type="text" formControlName="pin" class="form-control" maxlength="4"
               [class.error]="submitAttempted && alumnoForm.get('pin')?.invalid"
               placeholder="****" inputmode="numeric" pattern="[0-9]*">
      </div>

      <button *ngIf="!registrationSuccess" type="submit" class="btn btn-black">
        Registrar
      </button>
    </form>

    <p class="link-text" *ngIf="!registrationSuccess" (click)="volverDashboard()">
      ← Volver al panel
    </p>
  </div>
</div>
